</button>

<!-- BottomNavBar (Hidden for focused task as per suppression rule: Task-Focused sub-page) -->
<!-- Navigation is hidden to prioritize the form completion flow -->
<script>
(() => {
  const params = new URLSearchParams(window.location.search);
  const visitId = params.get('visit_id') || params.get('id') || '';

  const nameInput = document.getElementById('visitor-name');
  const companyInput = document.getElementById('visitor-company');
  const emailInput = document.getElementById('visitor-email');
  const phoneInput = document.getElementById('visitor-phone');
  const notesInput = document.getElementById('visitor-notes');

  function setClearance(value) {
    const radios = document.querySelectorAll('input[name="clearance"]');
    radios.forEach((radio) => {
      const label = radio.closest('label');
      const checked = value && radio.value === value;
      radio.checked = checked;
      if (!label) return;
      if (checked) {
        label.classList.add('border-primary-container', 'bg-surface-container-low');
        label.classList.remove('border-outline-variant', 'bg-white');
      } else {
        label.classList.remove('border-primary-container', 'bg-surface-container-low');
        label.classList.add('border-outline-variant', 'bg-white');
      }
    });
  }

  function applyProfile(v) {
    nameInput.value = v.visitor_name || '';
    companyInput.value = v.visitor_company || '';
    emailInput.value = v.visitor_email || '';
    phoneInput.value = v.visitor_phone || '';
    notesInput.value = v.visitor_notes || '';
    setClearance(v.visitor_clearance || '');
  }

  async function loadFromVisit() {
    if (visitId) {
      try {
        const res = await fetch(`/api/visits/${visitId}`);
        if (res.ok) {
          applyProfile(await res.json());
          return;
        }
      } catch (err) {
        console.error(err);
      }
    }

    try {
      const cached = JSON.parse(sessionStorage.getItem('pending_visitor_profile') || 'null');
      if (cached) {
        applyProfile({
          visitor_name: cached.visitor_name || '',
          visitor_company: cached.visitor_company || '',
          visitor_email: '',
          visitor_phone: '',
          visitor_notes: '',
          visitor_clearance: '',
        });
        return;
      }
    } catch (err) {
      // ignore
    }

    applyProfile({});
  }

  async function saveProfile(redirectTo) {
    if (!visitId) {
      alert('연결된 방문 일정이 없습니다. 일정 등록 후 다시 시도하세요.');
      return;
    }

    const clearance = document.querySelector('input[name="clearance"]:checked');
    const payload = {
      visitor_name: nameInput.value.trim(),
      visitor_company: companyInput.value.trim(),
      visitor_email: emailInput.value.trim(),
      visitor_phone: phoneInput.value.trim(),
      visitor_clearance: clearance ? clearance.value : '',
      visitor_notes: notesInput.value.trim(),
    };

    try {
      const res = await fetch(`/api/visits/${visitId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || '저장 실패');
      window.location.href = redirectTo;
    } catch (err) {
      alert(err.message || '프로필 저장 중 오류가 발생했습니다.');
    }
  }

  document.querySelectorAll('input, textarea').forEach((el) => {
    el.addEventListener('focus', () => {
      el.parentElement.querySelector('label')?.classList.add('text-primary');
    });
    el.addEventListener('blur', () => {
      el.parentElement.querySelector('label')?.classList.remove('text-primary');
    });
  });

  const radioLabels = document.querySelectorAll('label:has(input[type="radio"])');
  radioLabels.forEach((label) => {
    const input = label.querySelector('input');
    input.addEventListener('change', () => setClearance(input.value));
  });

  document.getElementById('cancel-btn').addEventListener('click', () => {
    if (confirm('작성을 취소하고 메인화면으로 이동할까요?')) {
      window.location.href = '/';
    }
  });
  document.getElementById('save-schedule-btn').addEventListener('click', () => {
    saveProfile(visitId ? `/managing_schedule.html?id=${encodeURIComponent(visitId)}` : '/managing_schedule.html');
  });
  document.getElementById('save-main-btn').addEventListener('click', () => {
    saveProfile(visitId ? `/visit_management.html?id=${encodeURIComponent(visitId)}` : '/');
  });

  loadFromVisit();
})();
</script>
