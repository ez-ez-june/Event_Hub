<!-- Floating Action Button Contextual Logic (Excluded based on task: only menu shown) -->
<script>
        // Micro-interaction for the close button
        const closeBtn = document.querySelector('button[aria-label="Close menu"]');
        const drawer = document.querySelector('main');
        
        closeBtn.addEventListener('click', () => {
            drawer.style.transform = 'translateX(100%)';
            setTimeout(() => {
                // In a real app, this would route back or close overlay
                drawer.style.transform = 'translateX(0)'; 
            }, 1000);
        });

        // Hover effect for nav items
        const navItems = document.querySelectorAll('nav a');
        navItems.forEach(item => {
            item.addEventListener('mouseenter', () => {
                if(!item.classList.contains('bg-primary-container')) {
                    item.style.backgroundColor = 'var(--tw-bg-opacity, #dfe9fa)';
                }
            });
            item.addEventListener('mouseleave', () => {
                if(!item.classList.contains('bg-primary-container')) {
                    item.style.backgroundColor = 'transparent';
                }
            });
        });
    </script>
