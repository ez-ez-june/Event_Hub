databases:
  - name: event-hub-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: event-hub
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: FLASK_DEBUG
        value: "0"
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: event-hub-db
          property: connectionString
