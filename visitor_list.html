<!DOCTYPE html>
<html class="light" lang="ko">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>방문객 리스트 - POSCO Visit</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          primary: "#002b6b",
          "primary-container": "#004098",
          "on-primary": "#ffffff",
          surface: "#f8f9ff",
          "surface-container": "#e5eeff",
          "surface-container-low": "#eef4ff",
          "surface-container-high": "#dfe9fa",
          "surface-container-lowest": "#ffffff",
          "on-surface": "#121c28",
          "on-surface-variant": "#434652",
          outline: "#737783",
          "outline-variant": "#c3c6d4",
          secondary: "#9a4600",
        },
        fontFamily: {
          headline: ["Plus Jakarta Sans"],
          body: ["Inter"],
        },
        spacing: {
          "margin-mobile": "20px",
          "margin-desktop": "40px",
          md: "16px",
          lg: "24px",
        },
      },
    },
  };
</script>
<style>
  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
  }
  body {
    background: #f8f9ff;
    -webkit-font-smoothing: antialiased;
  }
  .glass-header {
    backdrop-filter: blur(8px);
    background-color: rgba(248, 249, 255, 0.88);
  }
  .search-panel {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.25s ease, opacity 0.2s ease, margin 0.2s ease;
    opacity: 0;
  }
  .search-panel.is-open {
    max-height: 80px;
    opacity: 1;
    margin-bottom: 12px;
  }
</style>
</head>
<body class="font-body text-on-surface">
<header class="fixed top-0 left-0 w-full z-40 border-b border-outline-variant glass-header">
  <div class="flex justify-between items-center h-16 px-margin-mobile md:px-margin-desktop w-full gap-3">
    <div class="flex items-center gap-2 min-w-0">
      <a href="/" class="flex items-center justify-center w-9 h-9 rounded-lg hover:bg-surface-container-low text-primary shrink-0" aria-label="대시보드로">
        <span class="material-symbols-outlined">arrow_back</span>
      </a>
      <div class="min-w-0">
        <h1 class="font-headline text-[18px] md:text-[22px] font-bold text-primary truncate">방문객 리스트</h1>
        <p id="list-count" class="text-[12px] text-on-surface-variant">Total 0</p>
      </div>
    </div>
    <button type="button" id="search-toggle-btn" class="flex items-center justify-center w-10 h-10 rounded-full border border-outline-variant bg-surface-container-lowest text-primary hover:bg-surface-container-low active:scale-95 transition-all" aria-label="검색">
      <span class="material-symbols-outlined">search</span>
    </button>
  </div>
</header>

<main class="pt-20 px-margin-mobile md:px-margin-desktop max-w-3xl mx-auto pb-28">
  <div id="search-panel" class="search-panel">
    <div class="relative">
      <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">search</span>
      <input id="search-input" type="search" placeholder="이름, 소속, 연락처, 이메일 검색" class="w-full h-11 pl-10 pr-10 rounded-xl border border-outline-variant bg-surface-container-lowest text-body text-[14px] outline-none focus:ring-2 focus:ring-primary focus:border-primary" autocomplete="off">
      <button type="button" id="search-clear-btn" class="hidden absolute right-2 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full text-outline hover:bg-surface-container-low" aria-label="검색어 지우기">
        <span class="material-symbols-outlined text-[18px]">close</span>
      </button>
    </div>
  </div>

  <div id="visitor-list" class="space-y-3">
    <div class="py-10 text-center text-on-surface-variant">불러오는 중...</div>
  </div>
</main>

<a href="/visitor.html" id="add-profile-btn" class="fixed right-5 bottom-6 z-50 w-14 h-14 rounded-full bg-primary text-on-primary shadow-lg flex items-center justify-center hover:bg-primary-container active:scale-95 transition-all" aria-label="프로필 등록">
  <span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">add</span>
</a>

<!-- Offscreen profile-only card for image export -->
<div id="profile-card-wrap" style="position:fixed;left:-9999px;top:0;z-index:-1;">
  <div id="profile-export-card" style="width:380px;background:#f8f9ff;color:#121c28;font-family:Inter,sans-serif;padding:24px;box-sizing:border-box;">
    <div style="font-size:11px;letter-spacing:0.08em;color:#9a4600;font-weight:700;margin-bottom:6px;">POSCO VISIT</div>
    <div style="font-size:22px;font-weight:800;color:#002b6b;margin-bottom:16px;">방문자 프로필</div>
    <div style="background:#fff;border:1px solid #c3c6d4;border-radius:12px;padding:16px;">
      <div style="display:flex;gap:14px;align-items:flex-start;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid #e5eeff;">
        <div style="width:84px;height:112px;border-radius:8px;border:1px solid #c3c6d4;background:#e8edf5;overflow:hidden;flex-shrink:0;">
          <img id="export-photo" alt="" style="display:none;width:100%;height:100%;object-fit:cover;">
          <svg id="export-photo-placeholder" viewBox="0 0 96 128" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;">
            <rect width="96" height="128" fill="#e8edf5"/>
            <circle cx="48" cy="42" r="22" fill="#b0becf"/>
            <path d="M18 118c0-22 13.4-36 30-36s30 14 30 36" fill="#b0becf"/>
          </svg>
        </div>
        <div style="flex:1;min-width:0;">
          <div id="export-clearance" style="display:inline-block;font-size:10px;background:#d9e2ff;color:#04429a;padding:2px 8px;border-radius:999px;font-weight:700;margin-bottom:8px;">미설정</div>
          <div id="export-name" style="font-size:18px;font-weight:800;color:#002b6b;margin-bottom:4px;">-</div>
          <div id="export-company" style="font-size:13px;color:#434652;font-weight:600;">-</div>
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #e5eeff;">
        <span style="color:#434652;font-size:13px;">이메일</span>
        <span id="export-email" style="font-weight:700;font-size:12px;text-align:right;max-width:62%;word-break:break-all;">-</span>
      </div>
      <div style="display:flex;justify-content:space-between;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #e5eeff;">
        <span style="color:#434652;font-size:13px;">연락처</span>
        <span id="export-phone" style="font-weight:700;font-size:13px;">-</span>
      </div>
      <div>
        <div style="color:#434652;font-size:13px;margin-bottom:6px;">주요 경력</div>
        <div id="export-notes" style="font-size:13px;font-weight:600;white-space:pre-wrap;word-break:break-word;line-height:1.45;">-</div>
      </div>
    </div>
    <div style="margin-top:14px;font-size:10px;color:#737783;">POSCO 방문객 프로필</div>
  </div>
</div>

<!-- Kakao/in-app: long-press save preview -->
<div id="save-preview-modal" class="fixed inset-0 z-[70] hidden">
  <div class="absolute inset-0 bg-black/55" id="save-preview-backdrop"></div>
  <div class="relative z-10 flex flex-col max-h-[92vh] w-full max-w-md mx-auto mt-[4vh] bg-surface-container-lowest rounded-t-2xl md:rounded-2xl overflow-hidden shadow-xl">
    <div class="flex items-center justify-between px-4 py-3 border-b border-outline-variant">
      <div>
        <p class="font-semibold text-[15px] text-primary">프로필 이미지 저장</p>
        <p class="text-[12px] text-on-surface-variant mt-0.5">이미지를 <strong>길게 눌러</strong> 저장하세요</p>
      </div>
      <button type="button" id="save-preview-close" class="w-9 h-9 rounded-full hover:bg-surface-container-low flex items-center justify-center" aria-label="닫기">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    <div class="overflow-y-auto p-4 bg-surface-container-low">
      <img id="save-preview-img" alt="방문자 프로필" class="w-full rounded-xl border border-outline-variant bg-white select-none" style="-webkit-touch-callout:default; touch-action:manipulation;">
    </div>
    <div class="p-4 border-t border-outline-variant space-y-2">
      <p id="save-preview-hint" class="text-[12px] text-center text-on-surface-variant leading-relaxed">카카오톡에서는 자동 다운로드가 되지 않습니다.<br>위 사진을 길게 누른 뒤 「이미지 저장」을 선택해 주세요.</p>
      <button type="button" id="save-preview-download" class="hidden w-full h-11 rounded-xl bg-primary text-on-primary font-semibold text-sm">다시 다운로드 시도</button>
    </div>
  </div>
</div>

<script>
(() => {
  const listEl = document.getElementById('visitor-list');
  const countEl = document.getElementById('list-count');
  const searchToggleBtn = document.getElementById('search-toggle-btn');
  const searchPanel = document.getElementById('search-panel');
  const searchInput = document.getElementById('search-input');
  const searchClearBtn = document.getElementById('search-clear-btn');

  let searchOpen = false;
  let debounceTimer = null;
  let visitors = [];
  let saving = false;
  let previewObjectUrl = null;

  const saveModal = document.getElementById('save-preview-modal');
  const savePreviewImg = document.getElementById('save-preview-img');
  const savePreviewDownloadBtn = document.getElementById('save-preview-download');
  const savePreviewHint = document.getElementById('save-preview-hint');

  function isKakaoInApp() {
    return /KAKAOTALK/i.test(navigator.userAgent || '');
  }

  function isRestrictedInApp() {
    const ua = navigator.userAgent || '';
    return /KAKAOTALK|Instagram|FBAN|FBAV|Line\//i.test(ua);
  }

  function photoBlock(photo) {
    if (photo) {
      return `<img src="${photo}" alt="" class="w-full h-full object-cover">`;
    }
    return `<svg class="w-full h-full" viewBox="0 0 96 128" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect width="96" height="128" fill="#e8edf5"/>
      <circle cx="48" cy="42" r="22" fill="#b0becf"/>
      <path d="M18 118c0-22 13.4-36 30-36s30 14 30 36" fill="#b0becf"/>
    </svg>`;
  }

  function escapeHtml(value) {
    return String(value || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function fillProfileCard(v) {
    document.getElementById('export-name').textContent = v.visitor_name || '-';
    document.getElementById('export-company').textContent = v.visitor_company || '-';
    document.getElementById('export-email').textContent = v.visitor_email || '-';
    document.getElementById('export-phone').textContent = v.visitor_phone || '-';
    document.getElementById('export-clearance').textContent = v.visitor_clearance || '미설정';
    document.getElementById('export-notes').textContent = v.visitor_notes || '-';

    const photo = document.getElementById('export-photo');
    const placeholder = document.getElementById('export-photo-placeholder');
    if (v.visitor_photo) {
      photo.src = v.visitor_photo;
      photo.style.display = 'block';
      placeholder.style.display = 'none';
    } else {
      photo.removeAttribute('src');
      photo.style.display = 'none';
      placeholder.style.display = 'block';
    }
  }

  function waitForExportPhoto() {
    const photo = document.getElementById('export-photo');
    if (photo.style.display === 'none' || !photo.src) return Promise.resolve();
    if (photo.complete && photo.naturalWidth > 0) return Promise.resolve();
    return new Promise((resolve) => {
      const done = () => resolve();
      photo.onload = done;
      photo.onerror = done;
      setTimeout(done, 800);
    });
  }

  function triggerDownload(blob, fileName) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  function closeSavePreview() {
    saveModal.classList.add('hidden');
    if (previewObjectUrl) {
      URL.revokeObjectURL(previewObjectUrl);
      previewObjectUrl = null;
    }
    savePreviewImg.removeAttribute('src');
    savePreviewDownloadBtn.classList.add('hidden');
    savePreviewDownloadBtn.onclick = null;
  }

  function openSavePreview(blob, fileName, visitorName) {
    if (previewObjectUrl) URL.revokeObjectURL(previewObjectUrl);
    previewObjectUrl = URL.createObjectURL(blob);
    savePreviewImg.src = previewObjectUrl;
    savePreviewHint.innerHTML = isKakaoInApp()
      ? '카카오톡에서는 자동 다운로드가 되지 않습니다.<br>위 사진을 <strong>길게 누른 뒤 「이미지 저장」</strong>을 선택해 주세요.'
      : '위 사진을 <strong>길게 누른 뒤 「이미지 저장」</strong>을 선택해 주세요.';
    // 일반 브라우저용 보조 버튼
    if (!isRestrictedInApp()) {
      savePreviewDownloadBtn.classList.remove('hidden');
      savePreviewDownloadBtn.onclick = () => {
        triggerDownload(blob, fileName);
        alert(`방문자 프로필 이미지가 휴대폰에 저장되었습니다.\n(${visitorName || '방문객'})`);
      };
    } else {
      savePreviewDownloadBtn.classList.add('hidden');
    }
    saveModal.classList.remove('hidden');
    alert(`프로필 이미지가 준비되었습니다.\n(${visitorName || '방문객'})\n\n사진을 길게 눌러 「이미지 저장」을 선택해 주세요.`);
  }

  async function saveProfileImage(v) {
    if (saving) return;
    if (typeof html2canvas !== 'function') {
      alert('이미지 저장 기능을 불러오지 못했습니다. 새로고침 후 다시 시도해 주세요.');
      return;
    }
    saving = true;
    try {
      fillProfileCard(v);
      await waitForExportPhoto();
      const target = document.getElementById('profile-export-card');
      const canvas = await html2canvas(target, {
        backgroundColor: '#f8f9ff',
        scale: 2,
        useCORS: true,
        logging: false,
        width: target.scrollWidth,
        height: target.scrollHeight,
        windowWidth: target.scrollWidth,
        windowHeight: target.scrollHeight,
      });
      const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/png'));
      if (!blob) throw new Error('이미지 생성에 실패했습니다.');

      const safeName = (v.visitor_name || 'visitor').replace(/[\\/:*?"<>|]/g, '_');
      const fileName = `visitor-profile-${safeName}.png`;
      const file = new File([blob], fileName, { type: 'image/png' });

      // 카카오톡 등 인앱: download 불가 → 길게 눌러 저장
      if (isRestrictedInApp()) {
        openSavePreview(blob, fileName, v.visitor_name);
        return;
      }

      // 모바일 브라우저: 공유 시트로 사진 앱에 저장 유도
      const shareData = { files: [file], title: '방문자 프로필' };
      if (navigator.canShare && navigator.canShare(shareData)) {
        try {
          await navigator.share(shareData);
          alert(`방문자 프로필 이미지가 휴대폰에 저장되었습니다.\n(${v.visitor_name || '방문객'})`);
          return;
        } catch (shareErr) {
          if (shareErr && shareErr.name === 'AbortError') return;
        }
      }

      // 일반 브라우저 다운로드
      try {
        triggerDownload(blob, fileName);
        alert(`방문자 프로필 이미지가 휴대폰에 저장되었습니다.\n(${v.visitor_name || '방문객'})`);
      } catch (dlErr) {
        console.warn(dlErr);
        openSavePreview(blob, fileName, v.visitor_name);
      }
    } catch (err) {
      console.error(err);
      alert(err.message || '프로필 이미지 저장 중 오류가 발생했습니다.');
    } finally {
      saving = false;
    }
  }

  document.getElementById('save-preview-close').addEventListener('click', closeSavePreview);
  document.getElementById('save-preview-backdrop').addEventListener('click', closeSavePreview);

  function renderItems(items) {
    visitors = items;
    countEl.textContent = `Total ${items.length}`;
    if (!items.length) {
      listEl.innerHTML = `<div class="py-12 text-center text-on-surface-variant border border-dashed border-outline-variant rounded-xl bg-surface-container-lowest">등록된 방문객이 없습니다.</div>`;
      return;
    }
    listEl.innerHTML = items.map((v, idx) => `
      <button type="button" class="visitor-item w-full text-left block bg-surface-container-lowest border border-outline-variant rounded-xl p-3 hover:border-primary/30 hover:shadow-sm active:scale-[0.99] transition-all" data-idx="${idx}">
        <div class="flex gap-3 items-start">
          <div class="w-14 h-[74px] rounded-md border border-outline-variant overflow-hidden bg-[#e8edf5] shrink-0">
            ${photoBlock(v.visitor_photo)}
          </div>
          <div class="min-w-0 flex-1">
            <div class="flex items-start justify-between gap-2">
              <div class="min-w-0">
                <div class="font-semibold text-[15px] text-on-surface truncate">${escapeHtml(v.visitor_name || '-')}</div>
                <div class="text-[13px] text-on-surface-variant truncate mt-0.5">${escapeHtml(v.visitor_company || '소속 미등록')}</div>
              </div>
              <span class="shrink-0 text-[11px] font-bold px-2 py-0.5 rounded-full bg-surface-container text-primary">${escapeHtml(v.visitor_clearance || '등급 미설정')}</span>
            </div>
            <div class="mt-2 text-[12px] text-on-surface-variant space-y-0.5">
              <div class="truncate">${escapeHtml(v.visitor_phone || '연락처 없음')} · ${escapeHtml(v.visitor_email || '이메일 없음')}</div>
              <div class="truncate text-primary/80 font-medium">탭하여 프로필 이미지 저장</div>
            </div>
          </div>
        </div>
      </button>
    `).join('');

    listEl.querySelectorAll('.visitor-item').forEach((btn) => {
      btn.addEventListener('click', () => {
        const idx = Number(btn.getAttribute('data-idx'));
        const visitor = visitors[idx];
        if (visitor) saveProfileImage(visitor);
      });
    });
  }

  async function loadVisitors(q = '') {
    listEl.innerHTML = `<div class="py-10 text-center text-on-surface-variant">불러오는 중...</div>`;
    try {
      const params = new URLSearchParams();
      if (q) params.set('q', q);
      const res = await fetch(`/api/visitors?${params}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || '목록을 불러오지 못했습니다.');
      renderItems(data.items || []);
    } catch (err) {
      listEl.innerHTML = `<div class="py-10 text-center text-red-600">${escapeHtml(err.message || '오류가 발생했습니다.')}</div>`;
    }
  }

  function setSearchOpen(open) {
    searchOpen = open;
    searchPanel.classList.toggle('is-open', open);
    searchToggleBtn.classList.toggle('bg-primary', open);
    searchToggleBtn.classList.toggle('text-on-primary', open);
    searchToggleBtn.classList.toggle('border-primary', open);
    if (open) {
      searchInput.focus();
    } else {
      searchInput.value = '';
      searchClearBtn.classList.add('hidden');
      loadVisitors('');
    }
  }

  searchToggleBtn.addEventListener('click', () => {
    setSearchOpen(!searchOpen);
  });

  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim();
    searchClearBtn.classList.toggle('hidden', !q);
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => loadVisitors(q), 220);
  });

  searchClearBtn.addEventListener('click', () => {
    searchInput.value = '';
    searchClearBtn.classList.add('hidden');
    searchInput.focus();
    loadVisitors('');
  });

  loadVisitors();
})();
</script>
</body>
</html>
