<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

<body class="bg-background text-on-surface font-body-md min-h-screen pb-32">
<!-- Top App Bar -->
<header class="w-full top-0 sticky z-50 bg-surface-container-lowest border-b border-outline-variant flex items-center justify-between px-margin-mobile py-sm h-16">
<a href="/" class="flex items-center gap-2 text-primary">
<span class="material-symbols-outlined">arrow_back</span>

<main class="px-margin-mobile mt-md space-y-xl">

<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary">방문 일정 등록</h2>

</section>
<section class="space-y-sm">
  <label class="font-label-caps text-label-caps text-primary uppercase">방문지 선택</label>
  <div id="location-group" class="grid grid-cols-3 gap-sm">
    <button type="button" data-location="포항" class="location-btn location-pick loc-pohang py-sm text-body-md transition-all active:scale-95"><span>포항</span></button>
    <button type="button" data-location="광양" class="location-btn location-pick loc-gwangyang py-sm text-body-md transition-all active:scale-95"><span>광양</span></button>
    <button type="button" data-location="서울" class="location-btn location-pick loc-seoul is-active py-sm text-body-md transition-all active:scale-95"><span>서울</span></button>
  </div>
</section>
<section class="space-y-md">
<div class="space-y-sm">
<label class="font-label-caps text-label-caps text-primary uppercase">방문객 성함</label>
<input id="visitor-name" class="w-full bg-white border border-outline-variant rounded-lg px-md py-sm focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-outline" placeholder="방문객 성함을 입력하세요" type="text">
</div>
<div class="space-y-sm">
<label class="font-label-caps text-label-caps text-primary uppercase">소속 기관</label>
<input id="visitor-company" class="w-full bg-white border border-outline-variant rounded-lg px-md py-sm focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-outline" placeholder="기업명 또는 기관명" type="text">
</div>

<label class="font-label-caps text-label-caps text-primary uppercase">방문 목적</label>
<select id="purpose" class="w-full bg-white border border-outline-variant rounded-lg px-md py-sm focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all">
<option>비즈니스 미팅</option>
<option>시설 견학</option>
<option>공식 행사</option>
<option>기타 전문 업무</option>
</select>
</div>
<div class="space-y-sm">
<label class="font-label-caps text-label-caps text-primary uppercase">등록자</label>
<div class="bg-white border border-outline-variant rounded-xl p-md space-y-md">
<div class="space-y-sm">
<label class="text-[12px] text-on-surface-variant font-medium">이름</label>

<div class="space-y-sm">
<label class="text-[12px] text-on-surface-variant font-medium">부서</label>

</div>
</div>

<label class="font-label-caps text-label-caps text-primary uppercase">방문 날짜</label>

<input id="visit-date" class="w-full bg-white border border-outline-variant rounded-lg px-md py-sm focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all" type="date">

</div>

</div>

<!-- Specific Schedule Section -->
<section class="space-y-md">
<div class="flex justify-between items-center">
<h3 class="font-headline-sm text-headline-sm text-on-surface">세부 일정 미리보기</h3>
<button type="button" id="add-schedule-btn" class="text-primary-container font-label-caps text-label-caps flex items-center gap-1 active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[18px]">add_circle</span> 항목 추가
</button>
</div>
<div id="schedule-list" class="space-y-0"></div>
<p id="schedule-empty" class="text-body-md text-on-surface-variant py-md text-center border border-dashed border-outline-variant rounded-xl">등록된 세부 일정이 없습니다. 항목을 추가하세요.</p>
</section>

</main>
<div class="fixed bottom-0 left-0 w-full bg-surface-container-lowest border-t border-outline-variant p-margin-mobile pb-8 z-50 shadow-[0_-4px_20px_rgba(0,0,0,0.05)]">
<div class="flex gap-2 items-stretch">
<button type="button" id="cancel-btn" class="flex-1 min-w-0 border border-outline-variant bg-surface text-on-surface text-[12px] font-semibold py-3 px-1 rounded-xl flex items-center justify-center text-center leading-tight active:scale-95 transition-all hover:bg-surface-container-low">
취소
</button>
<button type="button" id="save-visitor-btn" class="flex-[1.4] min-w-0 bg-primary-container text-on-primary text-[12px] font-semibold py-3 px-1 rounded-xl flex items-center justify-center text-center leading-tight active:scale-95 transition-all shadow-md">
저장 후<br>방문자 프로필 등록
</button>
<button type="button" id="save-main-btn" class="flex-[1.4] min-w-0 bg-primary text-on-primary text-[12px] font-semibold py-3 px-1 rounded-xl flex items-center justify-center text-center leading-tight active:scale-95 transition-all shadow-md">
저장 후<br>메인화면 이동
</button>
</div>
</div>
<script>
(() => {
  let selectedLocation = '서울';
  let scheduleItems = [];
  let editingId = null;
  const visitId = new URLSearchParams(window.location.search).get('id');

  const dateInput = document.getElementById('visit-date');
  dateInput.value = new Date().toISOString().slice(0, 10);

  const listEl = document.getElementById('schedule-list');
  const emptyEl = document.getElementById('schedule-empty');

  function setLocation(location) {
    selectedLocation = location;
    document.querySelectorAll('.location-btn').forEach((b) => {
      const active = b.dataset.location === location;
      b.classList.toggle('is-active', active);
    });
  }

  document.querySelectorAll('.location-btn').forEach((btn) => {
    btn.addEventListener('click', () => setLocation(btn.dataset.location));
  });

  function uid() {
    return `s_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
  }

  function renderSchedule() {
    emptyEl.classList.toggle('hidden', scheduleItems.length > 0 || editingId !== null);
    listEl.innerHTML = '';

    scheduleItems.forEach((item, index) => {
      if (editingId === item.id) {
        listEl.appendChild(buildEditor(item, index));
        return;
      }
      const row = document.createElement('div');
      row.className = 'timeline-item relative flex gap-md pb-md';
      row.innerHTML = `
        <div class="z-10 bg-primary w-6 h-6 rounded-full flex items-center justify-center shrink-0 mt-1 shadow-sm">
          <span class="text-[12px] text-white font-bold">${index + 1}</span>
        </div>
        <div class="bg-white border border-outline-variant rounded-xl p-md w-full shadow-sm hover:border-primary transition-colors">
          <div class="flex justify-between items-start">
            <div>
              <span class="font-label-caps text-label-caps text-primary bg-primary-fixed px-2 py-0.5 rounded-full">${escapeHtml(formatTimeDisplay(item.time))}</span>
              <h4 class="font-headline-sm text-headline-sm mt-sm">${escapeHtml(item.title || '제목 없음')}</h4>
            </div>
            <div class="flex gap-1">
              <button type="button" data-edit="${item.id}" class="text-outline hover:text-primary transition-colors" title="수정">
                <span class="material-symbols-outlined">edit</span>
              </button>
              <button type="button" data-delete="${item.id}" class="text-outline hover:text-error transition-colors" title="삭제">
                <span class="material-symbols-outlined">delete_outline</span>
              </button>
            </div>
          </div>
          <p class="text-body-md text-on-surface-variant mt-sm">${escapeHtml(item.description || '')}</p>
        </div>`;
      listEl.appendChild(row);
    });

    if (editingId === '__new__') {
      listEl.appendChild(buildEditor({ id: '__new__', time: '', title: '', description: '' }, scheduleItems.length));
    }

    listEl.querySelectorAll('[data-edit]').forEach((btn) => {
      btn.addEventListener('click', () => {
        editingId = btn.getAttribute('data-edit');
        renderSchedule();
      });
    });
    listEl.querySelectorAll('[data-delete]').forEach((btn) => {
      btn.addEventListener('click', () => {
        if (!confirm('이 일정을 삭제하시겠습니까?')) return;
        const id = btn.getAttribute('data-delete');
        scheduleItems = scheduleItems.filter((x) => x.id !== id);
        if (editingId === id) editingId = null;
        renderSchedule();
      });
    });
  }

  function buildEditor(item, index) {
    const row = document.createElement('div');
    row.className = 'timeline-item relative flex gap-md pb-md';
    row.innerHTML = `
      <div class="z-10 bg-secondary-container w-6 h-6 rounded-full flex items-center justify-center shrink-0 mt-1 shadow-sm">
        <span class="material-symbols-outlined text-white text-[16px]" style="font-variation-settings: 'FILL' 1;">edit</span>
      </div>
      <div class="bg-surface-container-low border-2 border-dashed border-primary rounded-xl p-md w-full">
        <div class="space-y-md">
          <div class="flex gap-sm">
            <input id="edit-time" class="w-1/3 bg-white border border-outline-variant rounded-lg px-2 py-1 text-sm" type="time" value="${escapeAttr(toTimeValue(item.time))}">
            <input id="edit-title" class="w-2/3 bg-white border border-outline-variant rounded-lg px-2 py-1 text-sm" placeholder="일정 제목" type="text" value="${escapeAttr(item.title || '')}">
          </div>
          <textarea id="edit-desc" class="w-full bg-white border border-outline-variant rounded-lg px-2 py-1 text-sm h-20 resize-none" placeholder="세부 설명을 입력하세요">${escapeHtml(item.description || '')}</textarea>
          <div class="flex justify-end gap-sm">
            <button type="button" id="edit-cancel" class="text-on-surface-variant text-sm px-3 py-1 hover:bg-white rounded-lg">취소</button>
            <button type="button" id="edit-save" class="bg-primary text-white text-sm px-4 py-1 rounded-lg">저장</button>
          </div>
        </div>
      </div>`;

    row.querySelector('#edit-cancel').addEventListener('click', () => {
      editingId = null;
      renderSchedule();
    });
    row.querySelector('#edit-save').addEventListener('click', () => {
      const time = row.querySelector('#edit-time').value.trim();
      const title = row.querySelector('#edit-title').value.trim();
      const description = row.querySelector('#edit-desc').value.trim();
      if (!title) {
        alert('일정 제목을 입력하세요.');
        return;
      }
      if (item.id === '__new__') {
        scheduleItems.push({ id: uid(), time, title, description });
      } else {
        const target = scheduleItems.find((x) => x.id === item.id);
        if (target) {
          target.time = time;
          target.title = title;
          target.description = description;
        }
      }
      editingId = null;
      renderSchedule();
    });
    return row;
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function escapeAttr(str) {
    return escapeHtml(str).replace(/'/g, '&#39;');
  }

  function toTimeValue(value) {
    if (!value) return '10:00';
    const match = String(value).match(/(\d{1,2}):(\d{2})/);
    if (!match) return '10:00';
    let hour = parseInt(match[1], 10);
    const minute = match[2];
    if (/오후|PM/i.test(value) && hour < 12) hour += 12;
    if (/오전|AM/i.test(value) && hour === 12) hour = 0;
    return `${String(hour).padStart(2, '0')}:${minute}`;
  }

  function formatTimeDisplay(value) {
    if (!value) return '-';
    const [h, m] = value.split(':').map(Number);
    if (Number.isNaN(h) || Number.isNaN(m)) return value;
    const period = h < 12 ? '오전' : '오후';
    const hour12 = h % 12 === 0 ? 12 : h % 12;
    return `${period} ${hour12}:${String(m).padStart(2, '0')}`;
  }

  document.getElementById('add-schedule-btn').addEventListener('click', () => {
    if (editingId !== null) {
      alert('작성 중인 항목을 먼저 저장하거나 취소하세요.');
      return;
    }
    editingId = '__new__';
    renderSchedule();
    const titleInput = document.getElementById('edit-title');
    if (titleInput) titleInput.focus();
  });

  async function saveVisit(redirectTo) {
    if (editingId !== null) {
      alert('작성 중인 세부 일정을 먼저 저장하거나 취소하세요.');
      return;
    }
    const visitorName = document.getElementById('visitor-name').value.trim();
    if (!visitorName) {
      alert('방문객 성함을 입력하세요.');
      return;
    }

    const payload = {
      visit_date: document.getElementById('visit-date').value,
      start_time: document.getElementById('start-time').value,
      end_time: document.getElementById('end-time').value,
      visitor_name: visitorName,
      visitor_company: document.getElementById('visitor-company').value.trim(),
      registrant_name: document.getElementById('registrant-name').value.trim() || '이름',
      registrant_team: document.getElementById('registrant-team').value.trim() || '실',
      registrant_email: document.getElementById('registrant-email').value.trim() || '@posco.com',
      purpose: document.getElementById('purpose').value,
      location: selectedLocation,
      status: 'Confirmed',
      notes: document.getElementById('notes').value.trim(),
      schedule_items: scheduleItems.map(({ time, title, description }) => ({ time, title, description })),
    };

    const buttons = [document.getElementById('save-visitor-btn'), document.getElementById('save-main-btn')];
    buttons.forEach((btn) => {
      btn.disabled = true;
      btn.classList.add('opacity-70');
    });

    try {
      const url = visitId ? `/api/visits/${visitId}` : '/api/visits';
      const res = await fetch(url, {
        method: visitId ? 'PUT' : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || '저장 실패');

      sessionStorage.setItem('pending_visitor_profile', JSON.stringify({
        visit_id: visitId || data.id,
        visitor_name: payload.visitor_name || '',
        visitor_company: payload.visitor_company || '',
      }));

      const savedId = visitId || data.id;
      const next = redirectTo.includes('visitor')
        ? `/visitor.html?visit_id=${savedId}`
        : redirectTo;
      window.location.href = next;
    } catch (err) {
      alert(err.message || '저장 중 오류가 발생했습니다.');
      buttons.forEach((btn) => {
        btn.disabled = false;
        btn.classList.remove('opacity-70');
      });
    }
  }

  document.getElementById('cancel-btn').addEventListener('click', () => {
    if (confirm('작성을 취소하고 메인화면으로 이동할까요?')) {
      window.location.href = visitId ? `/visit_management.html?id=${visitId}` : '/';
    }
  });
  document.getElementById('save-visitor-btn').addEventListener('click', () => saveVisit('/visitor.html'));
  document.getElementById('save-main-btn').addEventListener('click', () => saveVisit('/'));

  async function loadVisit() {
    if (!visitId) {
      renderSchedule();
      return;
    }
    try {
      const res = await fetch(`/api/visits/${visitId}`);
      if (!res.ok) throw new Error('not found');
      const v = await res.json();
      document.getElementById('visitor-name').value = v.visitor_name || '';
      document.getElementById('visitor-company').value = v.visitor_company || '';
      document.getElementById('purpose').value = v.purpose || '비즈니스 미팅';
      document.getElementById('registrant-name').value = v.registrant_name || '이름';
      document.getElementById('registrant-team').value = v.registrant_team || '실';
      document.getElementById('registrant-email').value = v.registrant_email || '@posco.com';
      document.getElementById('visit-date').value = v.visit_date_iso || '';
      document.getElementById('start-time').value = v.start_time || '10:00';
      document.getElementById('end-time').value = v.end_time || '11:00';
      document.getElementById('notes').value = v.notes || '';
      setLocation(v.location === '서울 센터' ? '서울' : (v.location || '서울'));
      scheduleItems = (v.schedule_items || []).map((item) => ({
        id: uid(),
        time: item.time || '',
        title: item.title || '',
        description: item.description || '',
      }));
      renderSchedule();
    } catch (err) {
      alert('기존 일정을 불러오지 못했습니다.');
      renderSchedule();
    }
  }

  loadVisit();
})();
</script>
